<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Blog</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header class="header">
        <img src="./assets/icons/logo.svg" alt="Logo von Travel Blog">
        <div class="header-buttons">
            <a class="highlights" href="#highlights">Highlights</a>
            <a class="faq" href="#faq">FAQ</a>
            <a class="contacts" href="#contacts">Contacts</a>

        </div>

    </header>

    <section class="landing-section">
        <div class="layer">
     </div>

    </section>


    <section class="main-section">
        <p id="highlights">
                         <h1>
                    highlights
                </h1>   

        </p>

    </section>




    <section class="pro-tipps">
        <section class="pro-tipps-list">
            <p>
                FAQ
            </p>

        </section>

    </section>

    <section class="share">
        <p class="share-text">
            Contact Form
        </p>
        <button>
            send  
        </button>

    </section>

    <footer class="footer">
        <section class="footer-section-left">
            <div class="footer-section-left-links">
                <div class="footer-section-left-copyright"><img src="./assets/icons/copyright.svg"
                        alt="Copyright Symbol">Travel Blog 2026</img></div>
                <p>Imprint</p>
                <p>Cookie Preferences</p>
            </div>
        </section>

        <section class="footer-section-right">
            <a href="https://www.tiktok.com/" target="_blank"> <img src="./assets/icons/Tiktok.svg" alt="Tiktok"></a>
            <a href="https://www.youtube.com/" target="_blank"> <img src="./assets/icons/youtube.svg" alt="YouTube"></a>
            <a href="https://www.facebook.com/" target="_blank"> <img src="./assets/icons/facebook.svg"
                    alt="Facebook"></a>
            <a href="https://www.instagram.com/" target="_blank"> <img src="./assets/icons/Instagram_2016.svg"
                    alt="Instagram"></a>

        </section>


    </footer>
</body>

</html>
