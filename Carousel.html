<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML_Carousel</title>

    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="header">
        <img src="./assets/icons/logo.svg" alt="Logo von Travel Blog">
        <div class="header-buttons">
            <a class="highlights" href="#highlights">Highlights</a>
            <a  class="faq" href="#faq">FAQ</a>
            <a  class="contacts" href="#contacts">Contacts</a>

        </div>
    </header>
    <section class="landing-section-carousel">
        <div>
            <div class="landing-section-text">
                <h2>Where the Ocean Meets Your Soul</h2>
                <h1>The World’s Most Breathtaking Beaches</h1>
                <p>From powder-soft white sands to dramatic coastlines kissed by turquoise waves, these beaches are more than destinations — they’re feelings.</p>
            </div>
            <div class="authorsection">
                <img src="./assets/IMG/690fbef0c17eec1970205dee7813ecf3e1ca60ca.jpg" alt="Author">
                <p></p>
                <p></p>
                <p></p>
            </div>
        </div>

    </section>
    <footer class="footer">
        <section class="footer-section-left">                
            <div class="footer-section-left-links">
            <div class="footer-section-left-copyright"><img src="./assets/icons/copyright.svg" alt="Copyright Symbol">Travel Blog 2026</img></div>
                <p>Imprint</p>
                <p>Cookie Preferences</p>
            </div>
        </section>
        
        <section class="footer-section-right">
            <a href="https://www.tiktok.com/" target="_blank"> <img src="./assets/icons/Tiktok.svg" alt="Tiktok"></a>
            <a href="https://www.youtube.com/" target="_blank"> <img src="./assets/icons/youtube.svg" alt="YouTube"></a>
            <a href="https://www.facebook.com/" target="_blank"> <img src="./assets/icons/facebook.svg" alt="Facebook"></a>
            <a href="https://www.instagram.com/" target="_blank"> <img src="./assets/icons/Instagram_2016.svg" alt="Instagram"></a>

        </section>
    </footer>
    
</body>
</html>
